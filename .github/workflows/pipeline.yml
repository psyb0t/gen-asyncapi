name: pipeline

on:
  push:
  # Weekly run that refreshes the imported-by badge. pkg.go.dev updates its
  # importer count over days, so once a week is enough. It runs the whole
  # pipeline because the badge job republishes every badge from that run's
  # results, coverage included.
  #
  # The minute and hour come from a hash of the repo name, so this repo's run
  # does not queue at the same moment as every other scheduled job.
  schedule:
    - cron: "13 2 * * 4"
  workflow_dispatch:

jobs:
  code:
    permissions:
      contents: read
      security-events: write # uploads the security scan SARIF
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test-coverage"
      sec_command: "make sec"
      generate_command: "make generate"
      coverage_file: "coverage-percent.txt"
      sarif_file: "sec.sarif"
      sarif_category: "go"

  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
      importers: true

  # Publishes a GitHub release for each tag once the checks pass.
  release:
    needs: [code]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

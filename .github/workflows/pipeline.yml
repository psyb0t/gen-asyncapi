name: pipeline

# A Go module and generator: no image, no binaries. Every branch push runs
# lint, the tests with the coverage gate, the security scan and the
# generated-code check, all inside the Dockerfile.dev image. Pushes to main
# then refresh the badges. A v* tag does not rerun the checks: it waits for
# that commit's main run to succeed, cuts the GitHub release from the
# annotated tag message, refreshes the badges with the main run's coverage,
# and publishes the agent skill to ClawHub.
on: [push]

permissions: {}

jobs:
  # Every make target runs in the dev image, so the runner needs only Docker,
  # Make and Bash. No step needs a credential.
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write # uploads the security scan SARIF
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test-coverage"
      sec_command: "make sec"
      generate_command: "make generate"
      coverage_file: "coverage-percent.txt"
      sarif_file: "sec.sarif"
      sarif_category: "go"

  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  release:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # Tag runs read the coverage artifact from the main run they release.
  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
      actions: read # cross-run coverage artifact download on tags
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
      coverage_run_id: ${{ needs.wait.outputs.run_id }}

  # Publishes the agent skill to ClawHub once the release exists.
  publish-to-clawhub:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["gen-asyncapi"]'
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

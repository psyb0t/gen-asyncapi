title: gen-asyncapi
tagline: Go and TypeScript from AsyncAPI 3 specs
description: A code generator that turns an AsyncAPI 3 document into Go or TypeScript types, strict JSON decoding with validation, message dispatch and a WebSocket client, run from go generate.
lang: en
url: https://psyb0t.github.io
baseurl: /gen-asyncapi
repository: psyb0t/gen-asyncapi
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/gen-asyncapi
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/gen-asyncapi/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/gen-asyncapi
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
